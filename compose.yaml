name: ownly
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run docker/setup.ps1 or docker/setup.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Missing owner password}
      MARKET_COLLECTOR_TOKEN: ${MARKET_COLLECTOR_TOKEN:?Missing collector token}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESET_EMAIL_FROM: ${RESET_EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_INDIVIDUAL_PRICE_ID: ${STRIPE_INDIVIDUAL_PRICE_ID:-}
      STRIPE_PORTFOLIO_PRICE_ID: ${STRIPE_PORTFOLIO_PRICE_ID:-}
      COLLECTOR_URL: http://collector:8080
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ownly_data:/data
    depends_on:
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      MARKET_COLLECTOR_TOKEN: ${MARKET_COLLECTOR_TOKEN:?Missing collector token}
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  ownly_data:
